        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        uaNavy: '#0c2340',
                        uaRed: '#ab0520',
                        bgGray: '#f8fafc',
                        aiColor: '#6366f1',

        const BASE = "https://raw.githubusercontent.com/ccfddl/ccf-deadlines/refs/heads/main/conference/";

        // ── YAML PARSER ─────────────────────────────────────────────────────────────
        function parseConf(yaml) {
            const confsIdx = yaml.indexOf('confs:');
            if (confsIdx === -1) return null;
            const body = yaml.slice(confsIdx + 6);

            const rawBlocks = body.split(/\n    - year:/);
            const entries = [];

            for (const raw of rawBlocks) {
                if (!raw.trim()) continue;
                const block = raw;

                const yearM  = block.match(/^[\s:]*(\d{4})/);
                const linkM  = block.match(/\n\s+link:\s*(.+)/);
                const dateM  = block.match(/\n\s+date:\s*(.+)/);
                const placeM = block.match(/\n\s+place:\s*(.+)/);

                if (!yearM) continue;
                const year  = parseInt(yearM[1]);
                const link  = linkM  ? linkM[1].trim().replace(/['"]/g,'')  : '';
                const date  = dateM  ? dateM[1].trim().replace(/['"]/g,'')  : 'TBA';
                const place = placeM ? placeM[1].trim().replace(/['"]/g,'') : 'TBA';

                const tlStart = block.indexOf('timeline:');
                let abstract = null, deadline = null;

                if (tlStart !== -1) {
                    const tlBody = block.slice(tlStart + 9);
                    const absM  = tlBody.match(/abstract_deadline:\s*['"]?([\d]{4}-[\d]{2}-[\d]{2}[\s\d:]*)/);
                    const deadM = tlBody.match(/deadline:\s*['"]?([\d]{4}-[\d]{2}-[\d]{2}[\s\d:]*)/);
                    if (absM)  abstract = absM[1].trim().slice(0,10);
                    if (deadM) deadline = deadM[1].trim().slice(0,10);
                }

                entries.push({ year, link, date, place, abstract: abstract||'TBA', deadline: deadline||'TBA' });
            }

            if (!entries.length) return null;

            const now = Date.now();
            const upcoming = entries
                .filter(e => e.deadline !== 'TBA' && new Date(e.deadline + 'T23:59:59-12:00') >= now)
                .sort((a,b) => new Date(a.deadline) - new Date(b.deadline));
            
            if (upcoming.length) return upcoming[0];
            return entries.sort((a,b) => b.year - a.year)[0];
        }

        // ── FETCH ────────────────────────────────────────────────────────────────────
        async function fetchConf(m) {
            if (VERIFIED[m.id]) return { ...m, ...VERIFIED[m.id], source:'live' };

            const url = `${BASE}${m.sub}/${m.file}.yml`;
            try {
                const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
                if (!r.ok) throw new Error(r.status);
                const yaml = await r.text();
                const p = parseConf(yaml);
                if (!p) throw new Error('parse');
                return { ...m, ...p, source:'live' };
            } catch (e) {
                return { ...m, abstract:'TBA', deadline:'TBA', date:'TBA', place:'TBA', link:'', source:'fail' };
            }
        }

        };

        // ── STATE ────────────────────────────────────────────────────────────────────
        let allConfs = [], currentCatFilter = 'all', currentSeasonFilter = 'all', tickTimer = null;
        let monthOffset = 0, activeMonthFilter = null, currentView = 'grid';
        let tableSeasonFilter = 'all', tableCatFilter = 'all';

        // ── INIT ─────────────────────────────────────────────────────────────────────
        async function init() {
            const prog = document.getElementById('progBar');
            const CHUNK = 8;
            let done = 0;

            for (let i = 0; i < MASTER.length; i += CHUNK) {
                const results = await Promise.all(MASTER.slice(i, i+CHUNK).map(fetchConf));
                allConfs.push(...results);
                done += results.length;
                if (prog) prog.style.width = Math.round(done / MASTER.length * 100) + '%';
                
                if (currentView === 'grid') applyFilters();
                else renderTable();
            }

            const live = allConfs.filter(c => c.source === 'live').length;
            const dot  = document.getElementById('syncDot');
            const txt  = document.getElementById('syncText');
            
            // Update dot colors using Tailwind classes
            if (live === allConfs.length) {
                dot.className = 'w-2 h-2 rounded-full inline-block bg-emerald-500 animate-blink';
                txt.textContent = `All ${live} conferences synced live from ccfddl • Tickers update every second`;
            } else if (live > 0) {
                dot.className = 'w-2 h-2 rounded-full inline-block bg-amber-500';
                txt.textContent = `${live}/${allConfs.length} synced live • ${allConfs.length-live} files not found in repo`;
            } else {
                dot.className = 'w-2 h-2 rounded-full inline-block bg-red-500';
                txt.textContent = 'Could not reach ccfddl (CORS or network issue)';
            }

            if (tickTimer) clearInterval(tickTimer);
            tickTimer = setInterval(tick, 1000);
            
            // Final render for both views
            applyFilters();
            renderTable();
        }

        // ── COUNTDOWN ────────────────────────────────────────────────────────────────
        function pad2(n) { return String(n).padStart(2,'0'); }

        function timeRemaining(isoDate) {
            const target = new Date(isoDate + 'T23:59:59-12:00');
            const diff = target - Date.now();
            if (diff <= 0) return { expired:true, d:0, h:0, m:0, s:0 };
            const s = Math.floor(diff / 1000);
            return { expired:false, d:Math.floor(s/86400), h:Math.floor((s%86400)/3600), m:Math.floor((s%3600)/60), s:s%60 };
        }

        function colorCls(t) {
            if (t.expired) return 'text-slate-400 text-base font-semibold';
            if (t.d < 3)   return 'text-uaRed';
            if (t.d < 14)  return 'text-amber-600';
            return 'text-uaNavy';
        }

        function tick() {
            document.querySelectorAll('.countdown[data-deadline]').forEach(el => {
                const dl = el.getAttribute('data-deadline');
                if (!dl || dl === 'TBA') return;
                const t   = timeRemaining(dl);
                const cls = colorCls(t);
                const dEl = el.querySelector('.v-d');
                const hEl = el.querySelector('.v-h');
                const mEl = el.querySelector('.v-m');
                const sEl = el.querySelector('.v-s');
                if (!dEl) return;
                
                dEl.textContent = t.expired ? '--' : t.d;
                hEl.textContent = t.expired ? '--' : pad2(t.h);
                mEl.textContent = t.expired ? '--' : pad2(t.m);
                sEl.textContent = t.expired ? '--' : pad2(t.s);
                
                const baseClass = 'block text-2xl font-extrabold tabular-nums tracking-tight val-transition ';
                [dEl, hEl, mEl, sEl].forEach(e => { e.className = baseClass + cls; });
                
                if (t.expired) {
                    const card = el.closest('.card');
                    if (card) card.classList.add('card-expired');
                }
            });
        }

        // ── DATE FORMATTING ──────────────────────────────────────────────────────────
        function fmtDate(iso) {
            if (!iso || iso === 'TBA') return 'TBA';
            const d = new Date(iso + 'T12:00:00Z');
            if (isNaN(d)) return iso;
            return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        }

        function isPast(iso) {
            if (!iso || iso === 'TBA') return false;
            return new Date(iso + 'T23:59:59-12:00') < Date.now();
        }

        // ── CREATE CARD ───────────────────────────────────────────────────────────────
        function createCard(c) {
            const catLabel = { ai:'AI/ML', sys:'Systems' }[c.cat] || c.cat;
            const hasDl    = c.deadline && c.deadline !== 'TBA';
            const t        = hasDl ? timeRemaining(c.deadline) : null;
            const isExp    = t ? t.expired : false;
            const cls      = t ? colorCls(t) : 'text-slate-400 text-base font-semibold';
            const valClass = 'block text-2xl font-extrabold tabular-nums tracking-tight val-transition ' + cls;

            const cdHtml = hasDl
                ? `<div class="text-center min-w-[48px]"><span class="${valClass} v-d">${isExp ? '--' : t.d}</span><span class="text-[0.6rem] uppercase text-slate-400 tracking-wider mt-[2px] block">Days</span></div>
                   <div class="text-xl font-bold text-slate-300 pb-3 px-[1px]">:</div>
                   <div class="text-center min-w-[48px]"><span class="${valClass} v-h">${isExp ? '--' : pad2(t.h)}</span><span class="text-[0.6rem] uppercase text-slate-400 tracking-wider mt-[2px] block">Hrs</span></div>
                   <div class="text-xl font-bold text-slate-300 pb-3 px-[1px]">:</div>
                   <div class="text-center min-w-[48px]"><span class="${valClass} v-m">${isExp ? '--' : pad2(t.m)}</span><span class="text-[0.6rem] uppercase text-slate-400 tracking-wider mt-[2px] block">Min</span></div>
                   <div class="text-xl font-bold text-slate-300 pb-3 px-[1px]">:</div>
                   <div class="text-center min-w-[48px]"><span class="${valClass} v-s">${isExp ? '--' : pad2(t.s)}</span><span class="text-[0.6rem] uppercase text-slate-400 tracking-wider mt-[2px] block">Sec</span></div>`
                : `<div class="text-center min-w-[48px]"><span class="${valClass}">TBA</span><span class="text-[0.6rem] uppercase text-slate-400 tracking-wider mt-[2px] block">Deadline</span></div>`;

            const absClass  = c.abstract  === 'TBA' ? 'font-medium text-slate-400' : (isPast(c.abstract)  ? 'text-slate-300 line-through font-normal' : 'font-bold text-slate-800');
            const deadClass = c.deadline  === 'TBA' ? 'font-medium text-slate-400' : (isPast(c.deadline)  ? 'text-slate-300 line-through font-normal' : 'font-bold text-slate-800');
            const dateClass = c.date      === 'TBA' ? 'font-medium text-slate-400' : 'font-bold text-slate-800';
            const srcDot    = c.source === 'live'
                ? `<span class="w-1.5 h-1.5 rounded-full shrink-0 bg-emerald-500 animate-blink" title="Live from ccfddl"></span>`
                : `<span class="w-1.5 h-1.5 rounded-full shrink-0 bg-amber-500" title="Not found in repo"></span>`;
            
            const borderTopColor = c.cat === 'ai' ? 'border-t-aiColor' : 'border-t-sysColor';
            const badgeClass = c.cat === 'ai' ? 'bg-indigo-50 text-aiColor' : 'bg-amber-50 text-sysColor';

            return `
              <div class="card ${isExp ? 'card-expired ' : ''}bg-white rounded-xl p-5 shadow-sm hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 border-t-4 ${borderTopColor} flex flex-col">
                <div class="flex justify-between items-start mb-1">
                  <span class="text-[1.35rem] font-extrabold text-uaNavy">${c.name}</span>
                  ${c.link ? `<a href="${c.link}" target="_blank" class="text-slate-400 hover:text-blue-500 transition-colors text-sm"><i class="fas fa-external-link-alt"></i></a>` : ''}
                </div>
                <div class="text-xs text-slate-500 mb-4 leading-snug min-h-[1.9em]">${c.full}</div>

                <div class="countdown bg-gradient-to-br from-slate-50 to-slate-100 rounded-lg p-3 flex justify-center items-center gap-1 mb-4 border border-slate-100" data-deadline="${c.deadline}">${cdHtml}</div>

                <div class="text-[0.78rem] border-t border-slate-100 pt-3 flex flex-col gap-2">
                  <div class="flex justify-between items-center">
                    <span class="text-slate-500 font-medium flex items-center gap-1.5"><i class="fas fa-pencil-alt w-3 opacity-40"></i> Abstract</span>
                    <span class="${absClass} text-right">${c.abstract === 'TBA' ? 'TBA' : fmtDate(c.abstract)}</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-slate-500 font-medium flex items-center gap-1.5"><i class="fas fa-paper-plane w-3 opacity-40"></i> Full Paper</span>
                    <span class="${deadClass} text-right">${c.deadline === 'TBA' ? 'TBA' : fmtDate(c.deadline)}</span>
                  </div>
                  <div class="flex justify-between items-center">
                    <span class="text-slate-500 font-medium flex items-center gap-1.5"><i class="fas fa-calendar-alt w-3 opacity-40"></i> Conference</span>
                    <span class="${dateClass} text-right">${c.date}</span>
                  </div>
                  ${c.note ? `<div class="flex justify-between items-start mt-1 pt-1.5 border-t border-dashed border-slate-200">
                    <span class="italic text-slate-500 font-medium flex items-center gap-1.5"><i class="fas fa-info-circle w-3 opacity-40"></i> Note</span>
                    <span class="text-[0.7rem] text-slate-500 text-right max-w-[65%]">${c.note}</span>
                  </div>` : ''}
                </div>

                <div class="mt-auto pt-4 text-[0.7rem] text-slate-400 flex items-center gap-2">
                  <i class="fas fa-map-marker-alt shrink-0"></i>
                  <span class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap">${c.place}</span>
                  ${srcDot}
                  <span class="font-bold px-2 py-0.5 rounded text-[0.6rem] uppercase whitespace-nowrap ${badgeClass}">${catLabel}</span>
                </div>
              </div>`;
        }

        // ── RENDER ───────────────────────────────────────────────────────────────────
        function render(list) {
            const now = Date.now();
            const isUpcoming = c => {
                if (c.deadline === 'TBA') return true;
                const d = new Date(c.deadline + 'T23:59:59-12:00');
                return isNaN(d) || d >= now;
            };
            const upcoming = list.filter(isUpcoming)
                .sort((a,b) => {
                    if (a.deadline==='TBA') return 1;
                    if (b.deadline==='TBA') return -1;
                    return new Date(a.deadline) - new Date(b.deadline);
                });
            const past = list.filter(c => !isUpcoming(c))
                .sort((a,b) => new Date(b.deadline) - new Date(a.deadline));

            const filteredUpcoming = activeMonthFilter !== null
                ? upcoming.filter(c => getMonthIndex(c.abstract) === activeMonthFilter)
                : upcoming;

            let html = '';
            if (upcoming.length) {
                const monthNamesFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                const currentRealMonth = new Date().getMonth();
                
                let monthHtml = `<div class="flex items-center gap-1.5 text-[0.75rem] normal-case tracking-normal font-medium ml-auto mt-2 sm:mt-0">`;
                monthHtml += `<button onclick="changeMonthOffset(-1)" class="px-2 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors"><i class="fas fa-chevron-left"></i></button>`;
                
                for(let i=0; i<3; i++) {
                    let mIdx = (currentRealMonth + monthOffset + i) % 12;
                    if (mIdx < 0) mIdx += 12;
                    let isActive = activeMonthFilter === mIdx;
                    let activeCls = isActive ? 'bg-uaNavy text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200';
                    monthHtml += `<button onclick="toggleMonthFilter(${mIdx})" class="px-3 py-1.5 rounded transition-colors ${activeCls}">${monthNamesFull[mIdx]}</button>`;
                }
                
                monthHtml += `<button onclick="changeMonthOffset(1)" class="px-2 py-1.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors"><i class="fas fa-chevron-right"></i></button>`;
                if (activeMonthFilter !== null) {
                     monthHtml += `<button onclick="toggleMonthFilter(${activeMonthFilter})" class="px-2 py-1.5 rounded bg-red-50 text-red-500 hover:bg-red-100 transition-colors ml-1" title="Clear Month Filter"><i class="fas fa-times"></i></button>`;
                }
                monthHtml += `</div>`;

                html += `<div class="col-span-full mt-6 mb-2 pb-2 border-b-2 border-slate-200 text-uaNavy font-extrabold uppercase text-[0.85rem] tracking-wider flex flex-col sm:flex-row justify-between items-start sm:items-center">
                            <div class="flex items-center"><i class="fas fa-hourglass-half mr-1.5 opacity-50"></i>Upcoming Deadlines (${filteredUpcoming.length})</div>
                            ${monthHtml}
                         </div>`;
                         
                if (filteredUpcoming.length === 0) {
                    html += `<div class="col-span-full text-center py-8 text-slate-500 bg-white rounded-xl border border-dashed border-slate-200 shadow-sm">No upcoming conferences have abstract deadlines in ${monthNamesFull[activeMonthFilter]}.</div>`;
                } else {
                    filteredUpcoming.forEach(c => { html += createCard(c); });
                }
            }
            if (past.length) {
                html += `<div class="col-span-full mt-10 mb-2 pb-2 border-b-2 border-slate-200 text-uaNavy font-extrabold uppercase text-[0.85rem] tracking-wider"><i class="fas fa-check-circle mr-1.5 opacity-50"></i>Past / Finished (${past.length})</div>`;
                past.forEach(c => { html += createCard(c); });
            }
            if (!upcoming.length && !past.length) {
                html = '<div class="col-span-full text-center py-16 text-slate-500">No conferences match your filter/search.</div>';
            }
            document.getElementById('deadlineGrid').innerHTML = html;
        }

        // ── FILTER / SEARCH ───────────────────────────────────────────────────────────
        function setFilter(val, btn, type) {
            if (type === 'cat') {
                currentCatFilter = val;
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-white', 'text-uaNavy', 'shadow-sm');
                    b.classList.add('text-slate-600');
                });
            } else if (type === 'season') {
                currentSeasonFilter = val;
                document.querySelectorAll('.season-btn').forEach(b => {
                    b.classList.remove('active', 'bg-white', 'text-uaNavy', 'shadow-sm');
                    b.classList.add('text-slate-600');
                });
                
                if (val !== 'all') {
                    const now = Date.now();
                    // Find upcoming abstracts for the specific season
                    const upcomingAbstracts = allConfs.filter(c => {
                        if (getSeason(c.abstract) !== val) return false;
                        if (c.abstract === 'TBA') return true;
                        const d = new Date(c.abstract + 'T23:59:59-12:00');
                        return isNaN(d) || d >= now;
                    }).sort((a,b) => {
                        if (a.abstract === 'TBA') return 1;
                        if (b.abstract === 'TBA') return -1;
                        return new Date(a.abstract) - new Date(b.abstract);
                    });
                    
                    let targetMonth;
                    // Auto-detect the month of the first upcoming abstract
                    if (upcomingAbstracts.length > 0 && upcomingAbstracts[0].abstract !== 'TBA') {
                        targetMonth = getMonthIndex(upcomingAbstracts[0].abstract);
                    } else {
                        // Fallbacks to first month of season if no data/TBA
                        targetMonth = { 'spring': 0, 'summer': 4, 'fall': 8 }[val];
                    }
                    
                    const currentRealMonth = new Date().getMonth();
                    monthOffset = targetMonth - currentRealMonth;
                    activeMonthFilter = null; // Clear the specific month highlight
                } else {
                    monthOffset = 0; // Reset to today's current month
                    activeMonthFilter = null;
                }
            }
            
            btn.classList.add('active', 'bg-white', 'text-uaNavy', 'shadow-sm');
            btn.classList.remove('text-slate-600');
            
            applyFilters();
        }

        function getSeason(dateStr) {
            if (!dateStr || dateStr === 'TBA') return 'unknown';
            const month = parseInt(dateStr.split('-')[1], 10);
            if (month >= 1 && month <= 4) return 'spring';
            if (month >= 5 && month <= 8) return 'summer';
            if (month >= 9 && month <= 12) return 'fall';
            return 'unknown';
        }
        
        function getMonthIndex(dateStr) {
            if (!dateStr || dateStr === 'TBA') return -1;
            const parts = dateStr.split('-');
            if (parts.length < 2) return -1;
            return parseInt(parts[1], 10) - 1; // 0-indexed month
        }

        // ── VIEW TOGGLE AND TABLE RENDER ─────────────────────────────────────────────
        function switchView(view) {
            if (currentView === view) return;
            currentView = view;
            
            const btnGrid = document.getElementById('viewBtnGrid');
            const btnTable = document.getElementById('viewBtnTable');
            const gridCont = document.getElementById('deadlineGrid');
            const tableCont = document.getElementById('tableContainer');
            const gridControls = document.getElementById('gridControls');
            const searchWrapper = document.getElementById('searchWrapper');
            
            if (view === 'grid') {
                btnGrid.classList.add('bg-white', 'text-uaNavy', 'shadow-sm');
                btnGrid.classList.remove('text-slate-600', 'hover:bg-slate-300/50');
                
                btnTable.classList.remove('bg-white', 'text-uaNavy', 'shadow-sm');
                btnTable.classList.add('text-slate-600', 'hover:bg-slate-300/50');
                
                gridCont.classList.remove('hidden');
                tableCont.classList.add('hidden');
                
                // Show grid-specific controls
                gridControls.classList.remove('hidden', 'opacity-0');
                searchWrapper.classList.remove('hidden', 'opacity-0');
                
                applyFilters(); // Ensure grid is up-to-date
            } else {
                btnTable.classList.add('bg-white', 'text-uaNavy', 'shadow-sm');
                btnTable.classList.remove('text-slate-600', 'hover:bg-slate-300/50');
                
                btnGrid.classList.remove('bg-white', 'text-uaNavy', 'shadow-sm');
                btnGrid.classList.add('text-slate-600', 'hover:bg-slate-300/50');
                
                gridCont.classList.add('hidden');
                tableCont.classList.remove('hidden');
                
                // Hide grid-specific controls for the full annual view
                gridControls.classList.add('hidden', 'opacity-0');
                searchWrapper.classList.add('hidden', 'opacity-0');
                
                renderTable(); // Ensure table is up-to-date
            }
        }

        function updateTableFilter(type, val) {
            if (type === 'season') tableSeasonFilter = val;
            if (type === 'cat') tableCatFilter = val;
            renderTable();
        }

        function renderTable() {
            const catLabels = { ai: 'AI/ML/NLP/CV', sys: 'Systems/Arch' };
            const seasonLabels = { spring: 'Spring', summer: 'Summer', fall: 'Fall', unknown: 'TBA' };
            const seasonColors = { 
                spring: 'text-emerald-700 bg-emerald-50 border-emerald-200', 
                summer: 'text-amber-700 bg-amber-50 border-amber-200', 
                fall: 'text-orange-700 bg-orange-50 border-orange-200', 
                unknown: 'text-slate-500 bg-slate-50 border-slate-200' 
            };
            
            // Apply Table-specific Filters
            let tableConfs = allConfs.filter(c => {
                const sMatch = tableSeasonFilter === 'all' || getSeason(c.abstract) === tableSeasonFilter;
                const cMatch = tableCatFilter === 'all' || c.cat === tableCatFilter;
                return sMatch && cMatch;
            });
            
            // Sort Chronologically from January to December based on Abstract (ignoring year)
            tableConfs.sort((a, b) => {
                const getMD = d => (d && d !== 'TBA') ? d.substring(5, 10) : '99-99'; // Extract "MM-DD"
                return getMD(a.abstract).localeCompare(getMD(b.abstract));
            });
            
            let html = `
                <div class="mb-4 text-uaNavy">
                    <h2 class="text-xl font-bold">Annual Conference Schedule</h2>
                    <p class="text-sm text-slate-500">All 36 tracked conferences ordered chronologically by abstract deadline (January to December).</p>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-left border-collapse min-w-[950px]">
                        <thead class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
                            <tr>
                                <th class="p-3 border-b border-slate-200 font-bold w-[120px] align-bottom">
                                    <div class="flex flex-col gap-1.5">
                                        <span>Season</span>
                                        <select onchange="updateTableFilter('season', this.value)" class="text-[0.7rem] border border-slate-300 rounded p-1 font-medium text-slate-700 bg-white shadow-sm focus:outline-none focus:border-uaNavy focus:ring-1 focus:ring-uaNavy/30 w-full cursor-pointer transition-all">
                                            <option value="all" ${tableSeasonFilter === 'all' ? 'selected' : ''}>All</option>
                                            <option value="spring" ${tableSeasonFilter === 'spring' ? 'selected' : ''}>Spring</option>
                                            <option value="summer" ${tableSeasonFilter === 'summer' ? 'selected' : ''}>Summer</option>
                                            <option value="fall" ${tableSeasonFilter === 'fall' ? 'selected' : ''}>Fall</option>
                                        </select>
                                    </div>
                                </th>
                                <th class="p-3 border-b border-slate-200 font-bold min-w-[200px] align-bottom pb-4">Conference</th>
                                <th class="p-3 border-b border-slate-200 font-bold w-[140px] align-bottom">
                                    <div class="flex flex-col gap-1.5">
                                        <span>Theme</span>
                                        <select onchange="updateTableFilter('cat', this.value)" class="text-[0.7rem] border border-slate-300 rounded p-1 font-medium text-slate-700 bg-white shadow-sm focus:outline-none focus:border-uaNavy focus:ring-1 focus:ring-uaNavy/30 w-full cursor-pointer transition-all">
                                            <option value="all" ${tableCatFilter === 'all' ? 'selected' : ''}>All</option>
                                            <option value="ai" ${tableCatFilter === 'ai' ? 'selected' : ''}>AI/ML/NLP/CV</option>
                                            <option value="sys" ${tableCatFilter === 'sys' ? 'selected' : ''}>Systems/Arch</option>
                                        </select>
                                    </div>
                                </th>
                                <th class="p-3 border-b border-slate-200 font-bold align-bottom pb-4">Abstract</th>
                                <th class="p-3 border-b border-slate-200 font-bold align-bottom pb-4">Full Paper</th>
                                <th class="p-3 border-b border-slate-200 font-bold align-bottom pb-4">Event Date</th>
                                <th class="p-3 border-b border-slate-200 font-bold align-bottom pb-4">Location</th>
                            </tr>
                        </thead>
                        <tbody>`;
                     
            if (tableConfs.length === 0) {
                html += `<tr><td colspan="7" class="p-8 text-center text-slate-500 font-medium">No conferences match these filters.</td></tr>`;
            } else {
                tableConfs.forEach(c => {
                    const season = getSeason(c.abstract);
                    const badgeClass = c.cat === 'ai' ? 'bg-indigo-50 text-aiColor border-indigo-100' : 'bg-amber-50 text-sysColor border-amber-100';
                    const absClass  = c.abstract  === 'TBA' ? 'text-slate-400' : (isPast(c.abstract)  ? 'text-slate-400 line-through' : 'font-semibold text-slate-800');
                    const deadClass = c.deadline  === 'TBA' ? 'text-slate-400' : (isPast(c.deadline)  ? 'text-slate-400 line-through' : 'font-semibold text-slate-800');
                    
                    html += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors group">
                            <td class="p-3">
                                <span class="px-2 py-1 rounded border text-[0.65rem] font-bold uppercase tracking-wider whitespace-nowrap ${seasonColors[season]}">${seasonLabels[season]}</span>
                            </td>
                            <td class="p-3">
                                <div class="font-bold text-uaNavy flex items-center gap-2">
                                    ${c.name}
                                    ${c.link ? `<a href="${c.link}" target="_blank" class="text-slate-300 hover:text-blue-500 transition-colors"><i class="fas fa-external-link-alt text-[0.7rem]"></i></a>` : ''}
                                </div>
                                <div class="text-xs text-slate-500 mt-0.5 line-clamp-1 group-hover:line-clamp-none transition-all">${c.full}</div>
                            </td>
                            <td class="p-3">
                                <span class="px-2 py-1 rounded border text-[0.7rem] font-semibold whitespace-nowrap ${badgeClass}">${catLabels[c.cat]}</span>
                            </td>
                            <td class="p-3 text-sm ${absClass} whitespace-nowrap">${c.abstract === 'TBA' ? 'TBA' : fmtDate(c.abstract)}</td>
                            <td class="p-3 text-sm ${deadClass} whitespace-nowrap">${c.deadline === 'TBA' ? 'TBA' : fmtDate(c.deadline)}</td>
                            <td class="p-3 text-sm text-slate-600 whitespace-nowrap">${c.date}</td>
                            <td class="p-3 text-sm text-slate-600">
                                <div class="flex items-center gap-1.5">
                                    <i class="fas fa-map-marker-alt text-slate-300 text-xs shrink-0"></i>
                                    <span class="truncate max-w-[200px]" title="${c.place}">${c.place}</span>
                                </div>
                            </td>
                        </tr>`;
                });
            }
            
            html += `</tbody></table></div>`;
            document.getElementById('tableContainer').innerHTML = html;
        }

        function changeMonthOffset(delta) {
            monthOffset += delta;
            applyFilters();
        }

        function toggleMonthFilter(mIdx) {
            activeMonthFilter = (activeMonthFilter === mIdx) ? null : mIdx;
            applyFilters();
        }
        
        function applyFilters() {
            const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
            render(allConfs.filter(c => {
                const catMatch = currentCatFilter === 'all' || c.cat === currentCatFilter;
                const seasonMatch = currentSeasonFilter === 'all' || getSeason(c.abstract) === currentSeasonFilter;
                const searchMatch = !q || c.name.toLowerCase().includes(q) || c.full.toLowerCase().includes(q);
                return catMatch && seasonMatch && searchMatch;
            }));
        }

        // Boot
        init();
    </script>
</body>
</html>
